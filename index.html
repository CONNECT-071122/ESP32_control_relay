
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Điều khiển 8 Relay ESP32</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.1.0/mqttws31.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f1f3f6;
    margin: 0;
    padding: 15px;
    color: #333;
}

h2 {
    text-align: center;
    margin: 10px 0 20px;
}

.mqtt-status {
    max-width: 600px;
    margin: 0 auto 15px;
    padding: 12px;
    background: white;
    border-radius: 8px;
    text-align: center;
    font-weight: bold;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
}

.status-online {
    color: #28a745;
}

.status-offline {
    color: #dc3545;
}

#relay-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 15px;
    max-width: 1100px;
    margin: auto;
}

.relay-card {
    background: white;
    padding: 16px;
    border-radius: 10px;
    box-shadow: 0 3px 8px rgba(0,0,0,0.08);
}

.relay-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
}

.relay-title {
    font-size: 17px;
    font-weight: bold;
}

.relay-state {
    font-size: 13px;
    font-weight: bold;
}

.state-on {
    color: #28a745;
}

.state-off {
    color: #dc3545;
}

.relay-button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 6px;
    color: white;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    margin-bottom: 15px;
}

.btn-on {
    background: #28a745;
}

.btn-off {
    background: #dc3545;
}

.btn-disabled {
    opacity: 0.55;
    cursor: not-allowed;
}

.section-title {
    font-size: 14px;
    font-weight: bold;
    margin: 12px 0 7px;
}

.name-row {
    display: flex;
    gap: 6px;
}

input[type="text"] {
    min-width: 0;
    flex: 1;
    padding: 9px;
    border: 1px solid #ccc;
    border-radius: 5px;
}

input[type="number"] {
    width: 48px;
    padding: 8px 4px;
    border: 1px solid #ccc;
    border-radius: 5px;
    text-align: center;
}

button {
    cursor: pointer;
}

.btn-save {
    padding: 9px 12px;
    border: none;
    border-radius: 5px;
    background: #007bff;
    color: white;
    font-weight: bold;
}

.schedule-enable {
    display: flex;
    align-items: center;
    gap: 7px;
    margin: 12px 0;
    font-size: 13px;
}

.time-row {
    display: flex;
    align-items: center;
    gap: 5px;
    margin: 8px 0;
    font-size: 13px;
}

.time-label {
    width: 55px;
}

.btn-schedule {
    width: 100%;
    padding: 10px;
    background: #6c757d;
    color: white;
    border: none;
    border-radius: 5px;
    font-weight: bold;
    margin-top: 8px;
}

.btn-schedule.active {
    background: #007bff;
}

.schedule-info {
    font-size: 12px;
    color: #777;
    margin-top: 7px;
}

/* OTA */
.ota-box {
    max-width: 600px;
    margin: 0 auto 20px;
    padding: 16px;
    background: white;
    border-radius: 10px;
    box-shadow: 0 3px 8px rgba(0,0,0,0.1);
}

.ota-title {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 12px;
    color: #333;
}

.btn-ota {
    width: 100%;
    padding: 13px;
    background: #007bff;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 15px;
    font-weight: bold;
}

.btn-ota:disabled {
    background: #999;
    cursor: not-allowed;
}

.ota-status {
    margin-top: 12px;
    font-size: 13px;
    font-weight: bold;
    color: #666;
}

.ota-progress {
    width: 100%;
    height: 9px;
    background: #e5e5e5;
    border-radius: 10px;
    margin-top: 10px;
    overflow: hidden;
}

.ota-progress-bar {
    width: 0%;
    height: 100%;
    background: #007bff;
    transition: width 0.3s;
}

.ota-note {
    font-size: 11px;
    color: #888;
    margin-top: 8px;
}
</style>
</head>

<body>

<h2>ĐIỀU KHIỂN 8 RELAY ESP32</h2>

<div class="mqtt-status">
    MQTT:
    <span id="mqtt-status" class="status-offline">
        Đang khởi tạo...
    </span>
</div>

<!-- OTA -->
<div class="ota-box">
    <div class="ota-title">CẬP NHẬT FIRMWARE ESP32</div>

    <button
        class="btn-ota"
        id="btn-ota"
        onclick="startOTA()">
        CẬP NHẬT PHẦN MỀM
    </button>

    <div class="ota-status" id="ota-status">
        Trạng thái: Sẵn sàng cập nhật
    </div>

    <div class="ota-progress">
        <div class="ota-progress-bar" id="ota-progress-bar"></div>
    </div>

    <div class="ota-note">
        Không ngắt nguồn ESP32 trong quá trình cập nhật.
    </div>
</div>

<div id="relay-grid"></div>

<script>

/* ================= MQTT CONFIG ================= */

const MQTT_HOST = "broker.hivemq.com";
const MQTT_PORT = 8884;
const MQTT_PATH = "/mqtt";

const CONTROL_TOPIC = "esp32/relay8/control";
const STATUS_TOPIC = "esp32/relay8/status";

let client = null;
let mqttIsConnected = false;
let reconnectTimer = null;

let relayStates = Array(8).fill(false);

let relayNames = Array.from(
    {length: 8},
    (_, i) => "Relay " + (i + 1)
);

let relaySchedules = Array.from(
    {length: 8},
    () => ({
        en: false,
        on_h: 8,
        on_m: 0,
        off_h: 18,
        off_m: 0
    })
);

let nameDirty = Array(8).fill(false);
let scheduleDirty = Array(8).fill(false);

/* ================= OTA STATE ================= */

let otaRequested = false;
let otaStarted = false;

function setOTAStatus(message, color, progress) {
    const status = document.getElementById("ota-status");
    const bar = document.getElementById("ota-progress-bar");
    const button = document.getElementById("btn-ota");

    status.innerText = message;
    status.style.color = color;

    if (progress !== null) {
        bar.style.width = progress + "%";
    }

    button.disabled = otaStarted;
}

/* ================= BUILD RELAY UI ================= */

function buildGrid() {
    const grid = document.getElementById("relay-grid");
    grid.innerHTML = "";

    for (let i = 0; i < 8; i++) {
        const card = document.createElement("div");
        card.className = "relay-card";

        card.innerHTML = `
            <div class="relay-header">
                <div class="relay-title" id="relay-title-${i}">
                    Relay ${i + 1}
                </div>

                <div class="relay-state state-off" id="relay-state-${i}">
                    OFF
                </div>
            </div>

            <button
                class="relay-button btn-off"
                id="relay-btn-${i}"
                onclick="toggleRelay(${i})">
                BẬT RELAY
            </button>

            <div class="section-title">Tên thiết bị</div>

            <div class="name-row">
                <input
                    type="text"
                    id="relay-name-${i}"
                    value="Relay ${i + 1}"
                    maxlength="30"
                    onchange="relayNameEdited(${i})">

                <button
                    class="btn-save"
                    onclick="saveRelayName(${i})">
                    Lưu
                </button>
            </div>

            <div class="section-title">Cài đặt lịch</div>

            <label class="schedule-enable">
                <input
                    type="checkbox"
                    id="schedule-enable-${i}"
                    onchange="scheduleEnableChanged(${i})">
                Hẹn giờ trong ngày
            </label>

            <div class="time-row">
                <span class="time-label">Giờ bật</span>
                <input
                    type="number"
                    id="on-h-${i}"
                    min="0"
                    max="23"
                    value="8"
                    onchange="scheduleEdited(${i})">
                :
                <input
                    type="number"
                    id="on-m-${i}"
                    min="0"
                    max="59"
                    value="0"
                    onchange="scheduleEdited(${i})">
            </div>

            <div class="time-row">
                <span class="time-label">Giờ tắt</span>
                <input
                    type="number"
                    id="off-h-${i}"
                    min="0"
                    max="23"
                    value="18"
                    onchange="scheduleEdited(${i})">
                :
                <input
                    type="number"
                    id="off-m-${i}"
                    min="0"
                    max="59"
                    value="0"
                    onchange="scheduleEdited(${i})">
            </div>

            <button
                class="btn-schedule"
                id="schedule-btn-${i}"
                onclick="saveSchedule(${i})">
                LƯU LỊCH
            </button>

            <div class="schedule-info" id="schedule-info-${i}">
                Chưa bật hẹn giờ
            </div>
        `;

        grid.appendChild(card);
    }
}

/* ================= MQTT FUNCTIONS ================= */

function mqttConnected() {
    return client && mqttIsConnected;
}

function sendMQTT(data) {
    if (!mqttConnected()) {
        alert("Chưa kết nối MQTT!");
        return false;
    }

    try {
        const message = new Paho.MQTT.Message(
            JSON.stringify(data)
        );

        message.destinationName = CONTROL_TOPIC;
        client.send(message);

        return true;

    } catch (error) {
        console.error("MQTT SEND ERROR:", error);
        return false;
    }
}

/* ================= RELAY CONTROL ================= */

function toggleRelay(id) {
    if (relaySchedules[id].en) {
        alert("Relay đang bật chế độ hẹn giờ. Hãy tắt hẹn giờ trước khi điều khiển thủ công.");
        return;
    }

    const newState = !relayStates[id];

    sendMQTT({
        relay: id,
        state: newState ? 1 : 0
    });
}

/* ================= RENAME RELAY ================= */

function relayNameEdited(id) {
    nameDirty[id] = true;
}

function saveRelayName(id) {
    const name = document
        .getElementById("relay-name-" + id)
        .value.trim();

    if (!name) {
        alert("Tên relay không được để trống!");
        return;
    }

    if (sendMQTT({
        rename_relay: id,
        name: name
    })) {
        nameDirty[id] = false;
    }
}

/* ================= SCHEDULE ================= */

function scheduleEdited(id) {
    scheduleDirty[id] = true;
}

function scheduleEnableChanged(id) {
    scheduleDirty[id] = true;
}

function getScheduleValues(id) {
    const values = {
        en: document.getElementById("schedule-enable-" + id).checked,
        on_h: Number(document.getElementById("on-h-" + id).value),
        on_m: Number(document.getElementById("on-m-" + id).value),
        off_h: Number(document.getElementById("off-h-" + id).value),
        off_m: Number(document.getElementById("off-m-" + id).value)
    };

    if (
        values.on_h < 0 || values.on_h > 23 ||
        values.off_h < 0 || values.off_h > 23 ||
        values.on_m < 0 || values.on_m > 59 ||
        values.off_m < 0 || values.off_m > 59
    ) {
        return null;
    }

    return values;
}

function sameSchedule(a, b) {
    return (
        a.en === b.en &&
        a.on_h === b.on_h &&
        a.on_m === b.on_m &&
        a.off_h === b.off_h &&
        a.off_m === b.off_m
    );
}

function saveSchedule(id) {
    const values = getScheduleValues(id);

    if (!values) {
        alert("Giờ hoặc phút không hợp lệ!");
        return;
    }

    if (
        values.en &&
        values.on_h === values.off_h &&
        values.on_m === values.off_m
    ) {
        alert("Giờ bật và giờ tắt không được trùng nhau!");
        return;
    }

    if (sendMQTT({
        schedule_relay: id,
        enable: values.en,
        on_h: values.on_h,
        on_m: values.on_m,
        off_h: values.off_h,
        off_m: values.off_m
    })) {
        scheduleDirty[id] = false;
    }
}

/* ================= UPDATE WEB UI ================= */

function updateUI(data) {

    /* OTA STATUS */

    if (data.ota !== undefined) {

        if (data.ota === "downloading") {
            otaRequested = true;
            otaStarted = true;

            setOTAStatus(
                "ESP32 đang tải firmware từ GitHub...",
                "#17a2b8",
                50
            );

        } else if (data.ota === "failed") {
            otaRequested = false;
            otaStarted = false;

            setOTAStatus(
                "CẬP NHẬT THẤT BẠI! Kiểm tra Wi-Fi hoặc file firmware.",
                "#dc3545",
                0
            );

        } else if (data.ota === "wifi_error") {
            otaRequested = false;
            otaStarted = false;

            setOTAStatus(
                "ESP32 không có kết nối Wi-Fi!",
                "#dc3545",
                0
            );

        } else if (data.ota === "no_update") {
            otaRequested = false;
            otaStarted = false;

            setOTAStatus(
                "Không có bản cập nhật mới.",
                "#666",
                0
            );

        } else if (data.ota === "busy") {
            otaRequested = false;
            otaStarted = false;

            setOTAStatus(
                "ESP32 đang thực hiện một tác vụ cập nhật khác.",
                "#dc3545",
                0
            );

        } else if (
            data.ota === "idle" &&
            otaRequested &&
            otaStarted
        ) {
            otaRequested = false;
            otaStarted = false;

            setOTAStatus(
                "ESP32 đã kết nối lại sau cập nhật. Có thể cập nhật đã thành công.",
                "#28a745",
                100
            );
        }
    }

    /* RELAY STATES */

    if (Array.isArray(data.relays)) {
        data.relays.forEach((state, i) => {
            if (i >= 8) return;

            relayStates[i] = Boolean(state);

            const stateEl =
                document.getElementById("relay-state-" + i);

            const btn =
                document.getElementById("relay-btn-" + i);

            if (relayStates[i]) {
                stateEl.innerText = "ON";
                stateEl.className = "relay-state state-on";

                btn.innerText = "TẮT RELAY";
                btn.className = "relay-button btn-on";
            } else {
                stateEl.innerText = "OFF";
                stateEl.className = "relay-state state-off";

                btn.innerText = "BẬT RELAY";
                btn.className = "relay-button btn-off";
            }

            btn.disabled = Boolean(
                data.schedules &&
                data.schedules[i] &&
                data.schedules[i].en
            );

            if (btn.disabled) {
                btn.classList.add("btn-disabled");
            }
        });
    }

    /* RELAY NAMES */

    if (Array.isArray(data.names)) {
        data.names.forEach((name, i) => {
            if (i >= 8) return;

            relayNames[i] = name;

            if (!nameDirty[i]) {
                document.getElementById("relay-name-" + i).value = name;
            }

            document.getElementById("relay-title-" + i).innerText = name;
        });
    }

    /* SCHEDULES */

    if (Array.isArray(data.schedules)) {
        data.schedules.forEach((schedule, i) => {
            if (i >= 8) return;

            relaySchedules[i] = {
                en: Boolean(schedule.en),
                on_h: Number(schedule.on_h),
                on_m: Number(schedule.on_m),
                off_h: Number(schedule.off_h),
                off_m: Number(schedule.off_m)
            };

            if (!scheduleDirty[i]) {
                document.getElementById("schedule-enable-" + i).checked =
                    relaySchedules[i].en;

                document.getElementById("on-h-" + i).value =
                    relaySchedules[i].on_h;

                document.getElementById("on-m-" + i).value =
                    relaySchedules[i].on_m;

                document.getElementById("off-h-" + i).value =
                    relaySchedules[i].off_h;

                document.getElementById("off-m-" + i).value =
                    relaySchedules[i].off_m;
            }

            const info =
                document.getElementById("schedule-info-" + i);

            const btn =
                document.getElementById("schedule-btn-" + i);

            if (relaySchedules[i].en) {
                info.innerText =
                    "Đang hẹn giờ: " +
                    String(relaySchedules[i].on_h).padStart(2, "0") + ":" +
                    String(relaySchedules[i].on_m).padStart(2, "0") +
                    " → " +
                    String(relaySchedules[i].off_h).padStart(2, "0") + ":" +
                    String(relaySchedules[i].off_m).padStart(2, "0");

                btn.classList.add("active");
            } else {
                info.innerText = "Chưa bật hẹn giờ";
                btn.classList.remove("active");
            }
        });
    }
}

/* ================= OTA COMMAND ================= */

function startOTA() {
    if (!mqttConnected()) {
        alert("Chưa kết nối MQTT!");
        return;
    }

    if (otaStarted) {
        alert("ESP32 đang cập nhật firmware!");
        return;
    }

    const confirmUpdate = confirm(
        "Bạn có chắc chắn muốn cập nhật firmware ESP32?\n\n" +
        "ESP32 sẽ tải firmware mới từ GitHub và tự khởi động lại.\n\n" +
        "Không ngắt nguồn trong quá trình cập nhật."
    );

    if (!confirmUpdate) return;

    try {
        const message = new Paho.MQTT.Message("UPDATE");
        message.destinationName = CONTROL_TOPIC;

        client.send(message);

        otaRequested = true;
        otaStarted = true;

        setOTAStatus(
            "Đã gửi lệnh. Đang chờ ESP32 phản hồi...",
            "#17a2b8",
            0
        );

    } catch (error) {
        otaRequested = false;
        otaStarted = false;

        setOTAStatus(
            "Không gửi được lệnh cập nhật!",
            "#dc3545",
            0
        );

        console.error("OTA SEND ERROR:", error);
    }
}

/* ================= MQTT MESSAGE ================= */

function onMessageArrived(message) {
    try {
        const data = JSON.parse(message.payloadString);
        updateUI(data);

    } catch (error) {
        console.error("JSON ERROR:", error);
        console.log("MQTT MESSAGE:", message.payloadString);
    }
}

/* ================= MQTT CONNECTION ================= */

function startConnect() {
    const status = document.getElementById("mqtt-status");

    if (reconnectTimer) {
        clearTimeout(reconnectTimer);
        reconnectTimer = null;
    }

    status.innerText = "Đang khởi tạo MQTT...";
    status.className = "status-offline";

    if (typeof Paho === "undefined" || !Paho.MQTT) {
        status.innerText = "LỖI: Không tải được thư viện MQTT";
        console.error("Paho MQTT library is not loaded!");

        reconnectTimer = setTimeout(startConnect, 5000);
        return;
    }

    const clientId = "ESP32_WEB_" +
        Math.random().toString(16).substring(2, 10);

    try {
        client = new Paho.MQTT.Client(
            MQTT_HOST,
            MQTT_PORT,
            MQTT_PATH,
            clientId
        );

        client.onConnectionLost = function(response) {
            mqttIsConnected = false;

            status.innerText = "Mất kết nối MQTT";
            status.className = "status-offline";

            console.error("MQTT CONNECTION LOST:", response);

            if (otaStarted) {
                setOTAStatus(
                    "ESP32 đang cập nhật hoặc khởi động lại...",
                    "#17a2b8",
                    75
                );
            }

            reconnectTimer = setTimeout(startConnect, 5000);
        };

        client.onMessageArrived = onMessageArrived;

        status.innerText = "Đang kết nối HiveMQ...";

        console.log("Đang kết nối HiveMQ...");

        client.connect({
            useSSL: true,
            timeout: 15,
            keepAliveInterval: 30,

            onSuccess: function() {
                mqttIsConnected = true;

                status.innerText = "ĐÃ KẾT NỐI MQTT";
                status.className = "status-online";

                console.log("MQTT CONNECTED SUCCESSFULLY");

                client.subscribe(STATUS_TOPIC, {
                    onSuccess: function() {
                        console.log("Đã đăng ký topic:", STATUS_TOPIC);
                    },

                    onFailure: function(error) {
                        console.error("SUBSCRIBE ERROR:", error);
                    }
                });
            },

            onFailure: function(error) {
                mqttIsConnected = false;

                status.innerText = "MQTT LỖI: " +
                    (error.errorMessage || "Không xác định");

                status.className = "status-offline";

                console.error("MQTT CONNECT FAILED:", error);

                reconnectTimer = setTimeout(startConnect, 5000);
            }
        });

    } catch (error) {
        mqttIsConnected = false;

        status.innerText = "LỖI KHỞI TẠO MQTT";
        status.className = "status-offline";

        console.error("MQTT INIT ERROR:", error);

        reconnectTimer = setTimeout(startConnect, 5000);
    }
}

/* ================= START ================= */

buildGrid();
startConnect();

</script>

</body>
</html>
